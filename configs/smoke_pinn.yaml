# Quick smoke-test config: small data, few epochs — runs on a laptop/local GPU.
# Full training uses pinn.yaml on the server.
defaults:
  - base

seed: 0

dataset:
  train_size: 100       # use only 100 training trajectories
  batch_size: 4
  n_points: 512
  n_colloc: 256
  num_workers: 0        # avoid fork issues on local

train:
  epochs: 5
  lr: 1.0e-3
  lr_final: 1.0e-5
  lambda_data: 1.0
  lambda_phys: 0.1
  use_grad_balance: false
  lbfgs_finetune_epochs: 0
  val_max_batches: 5    # evaluate only 5 val batches per epoch (smoke only)

logging:
  ckpt_every: 5         # checkpoint every epoch in smoke mode

model:
  name: pinn
  ic_encoder:
    channels: [32, 64, 64]
    kernel: 5
    latent_dim: 128
  trunk:
    hidden_dim: 128
    n_layers: 6
    activation: tanh
