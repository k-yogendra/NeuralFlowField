defaults:
  - base

seed: 0

dataset:
  train_size: 500
  batch_size: 8
  n_points: 1024
  n_colloc: 512
  num_workers: 2

train:
  epochs: 10
  lr: 1.0e-3
  lr_final: 1.0e-5
  lambda_data: 1.0
  lambda_phys: 0.1
  use_grad_balance: false
  lbfgs_finetune_epochs: 0
  val_max_batches: 10

logging:
  ckpt_every: 5

model:
  name: pinf
  ic_encoder:
    channels: [32, 64, 64]
    kernel: 5
    latent_dim: 128
  encoding:
    type: siren
    omega_0: 30.0
  trunk:
    hidden_dim: 128
    n_layers: 6
    activation: tanh