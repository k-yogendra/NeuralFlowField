name: pinn-pinf
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pytorch>=2.1.0
  - torchvision>=0.16.0
  - pytorch-cuda=12.1          # adjust to your CUDA version
  - numpy>=1.24.0
  - scipy>=1.11.0
  - h5py>=3.9.0
  - matplotlib>=3.7.0
  - pytest>=7.4.0
  - pip
  - pip:
    - hydra-core>=1.3.2
    - omegaconf>=2.3.0
    - einops>=0.7.0
    - tensorboard>=2.14.0
    - wandb>=0.16.0
    - thop>=0.1.1
